[project]
name = "credit-oracle"
version = "0.1.0"
description = "Prediction markets as a catalyst screen for event-driven credit"
readme = "README.md"
authors = [{ name = "Belkacem Berchiche" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
