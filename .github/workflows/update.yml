name: update

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6h; odd minute to avoid the top-of-hour crowd
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "analytics/**", "data/mappings.yaml", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: fetch Polymarket
        run: uv run python -m pipeline.fetch_polymarket
      - name: build site data
        run: uv run python -m pipeline.build
      - name: commit snapshot
        run: |
          git config user.name "credit-oracle bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots data/history site/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
