# Curated map: Polymarket event -> transmission channel -> exposed credit instruments.
#
# This file is the product. Every line should survive a credit PM reading it.
#
# kind:        ladder  = "by <date>" rungs -> hazard curve
#              survival= "continues through <date>" rungs -> hazard of the state ending
#              single  = one YES/NO market
#              menu    = mutually exclusive outcomes (rate decisions); `focus` picks the headline
#              basket  = many single-name markets in one event; `names` gives per-name exposures
# category:    merger_arb | special_situations | distressed | macro | beta   (FSAM sub-strategy taxonomy)
# direction:   effect on the *credit* if YES resolves: positive | negative | mixed
# confidence:  how sure the transmission channel is, not how likely the event is

- slug: russia-x-ukraine-ceasefire-agreement-by
  title: Russia–Ukraine ceasefire agreement
  kind: ladder
  category: special_situations
  direction: positive
  headline: true
  exposures:
    - issuer: Raiffeisen Bank International
      instruments:
        - {isin: XS2785548053, type: AT1, note: "RBI 7.375% PerpNC"}
        - {isin: XS1640667116, type: AT1, note: "RBI 6.125% PerpNC (reset)"}
      channel: "Russian subsidiary deconsolidation / sanction-relief path; largest single geopolitical overhang on an EU bank AT1"
      confidence: high
    - issuer: OTP Bank
      instruments: [{isin: null, type: T2, note: "OTP EUR Tier 2", verify: true}]
      channel: "Ukraine + Russia exposure, CEE risk premium"
      confidence: medium
    - issuer: Ukraine (sovereign)
      instruments: [{isin: null, type: sovereign, note: "2024 restructured Eurobonds / GDP warrants", verify: true}]
      channel: "Reconstruction financing, warrant trigger economics"
      confidence: high
  scenarios:
    best: "Agreement with a credible sanctions-relief timetable → RBI AT1 re-rates toward Erste; CEE T2 tightens"
    base: "No agreement in 2026 (crowd ≈80%) → status quo; carry, call-date optionality unchanged"
    worst: "Talks collapse / escalation → Russian-sub write-down scenario reprices, AT1 extension risk"

- slug: israel-x-iran-ceasefire-continues-throughptptpt-20260716224448963
  title: Israel–Iran ceasefire holds
  kind: survival
  category: special_situations
  direction: negative       # YES = ceasefire *continues*; event of interest is it breaking → oil
  exposures:
    - issuer: European airlines
      instruments: [{isin: null, type: senior_hy, note: "Lufthansa hybrid / TAP / Wizz", verify: true}]
      channel: "Jet fuel + Gulf overflight closure"
      confidence: medium
    - issuer: Energy HY / shipping
      instruments: [{isin: null, type: senior_hy, note: "tanker & E&P names", verify: true}]
      channel: "Oil shock; mixed sign across the sector"
      confidence: low
  scenarios:
    best: "Ceasefire holds through year-end → oil premium fades, airline HY carries"
    base: "Holds with periodic scares → headline volatility, no credit event"
    worst: "Ceasefire breaks → oil spike, Gulf airspace closure; airline HY widens"

