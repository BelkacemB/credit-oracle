# Curated map: Polymarket event -> transmission channel -> exposed credit instruments.
#
# This file is the product. Every line should survive a credit PM reading it.
#
# kind:        ladder  = "by <date>" rungs -> hazard curve
#              survival= "continues through <date>" rungs -> hazard of the state ending
#              single  = one YES/NO market
#              menu    = mutually exclusive outcomes (rate decisions); `focus` picks the headline
#              basket  = many single-name markets in one event; `names` gives per-name exposures
# category:    merger_arb | special_situations | distressed | macro | beta   (FSAM sub-strategy taxonomy)
# direction:   effect on the *credit* if YES resolves: positive | negative | mixed
# confidence:  how sure the transmission channel is, not how likely the event is
# ISINs verified 2026-09-21 against Deutsche Börse (live.deutsche-boerse.com) unless noted 'no EU quote'.
# headline_instrument: the ISIN whose price is charted against the crowd probability on the event page.

